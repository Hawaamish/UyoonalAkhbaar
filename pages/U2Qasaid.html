<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>فهرست الاشعار</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <link rel="stylesheet" href="../styles/U2Qasaid.css">
    <script src="../scripts/U2Qasaid.js" defer></script>
</head>
<body>
	<div class="shell">
		<div class="mobile-side-toggle" id="mobileSideToggle">
			<button id="mobileSideBtn" class="mobile-side-btn" type="button" aria-expanded="false" aria-controls="mobileSidePanel">☰ القائمة</button>
			<div id="mobileSidePanel" class="mobile-side-panel">
				<button id="mobileMatlaBtn" class="mobile-side-option" type="button">قائمة المطالع</button>
				<button id="mobileSearchBtn" class="mobile-side-option" type="button">البحث</button>
			</div>
		</div>

		<section class="hero">
			<h1>فهرست الاَشعار الواردة في كتاب عيون الاَخبار - الجزء الثاني</h1>
		</section>

		<section class="layout">
			<aside class="matla-sidebar" aria-label="قائمة المطالع">
				<details id="matlaDetails">
					<summary>قائمة المطالع</summary>
					<div id="matlaList" class="matla-list"></div>
				</details>
			</aside>

			<aside class="filters" role="dialog" aria-modal="true" aria-label="خيارات البحث">
				<div class="filters-head">
					<h2 style="margin:0;">لوحة التصفية والبحث</h2>
					<button id="closeSearch" class="close-search" type="button" aria-label="إغلاق">✕</button>
				</div>

				<div class="field">
					<label for="searchMatla">بحث في المطلع</label>
					<input id="searchMatla" type="text" placeholder="اكتب كلمة من المطلع" />
				</div>

				<div class="field">
					<label for="searchReason">بحث في سبب التصنيف</label>
					<input id="searchReason" type="text" placeholder="اكتب كلمة من سبب التصنيف" />
				</div>

				<div class="field">
					<label for="pageExact">بحث برقم صفحة (صـ فقط)</label>
					<input id="pageExact" type="number" min="0" placeholder="مثال: 179" />
				</div>

				<div class="field">
					<label for="poetSearch">بحث في الشاعر</label>
					<select id="poetSearch">
						<option value="">كل الشعراء</option>
					</select>
				</div>

				<div class="field">
					<label for="bahrSelect">فلترة البحر (قائمة)</label>
					<select id="bahrSelect">
						<option value="">كل البحور</option>
					</select>
				</div>

				<div class="btn-row">
					<button class="btn ghost clear-btn" id="clearFilters" type="button">مسح الفلاتر</button>
					<button class="btn primary" id="applyFilters">تطبيق</button>
				</div>

				<div id="loadError" class="error" style="display:none;"></div>
			</aside>
			<div id="searchOverlay" class="search-overlay is-hidden"></div>

			<main class="content">
				<div class="toolbar">
					<div class="toolbar-row">
						<div class="stats">
							<span class="chip" id="shownCount">النتائج في الصفحة: 0</span>
							<span class="chip" id="pageInfo">الصفحة المختارة: -</span>
						</div>
						<div>
							<button class="btn ghost search-btn" id="toggleSearch" type="button" aria-pressed="false">البحث</button>
						</div>
					</div>

					<div id="pageStrip" class="page-strip"></div>
				</div>

				<div id="cards" class="cards"></div>

				<div class="pager">
					<button id="prevPage">الصفحة السابقة</button>
					<span id="pagerText">-</span>
					<button id="nextPage">الصفحة التالية</button>
				</div>
			</main>
		</section>
	</div>

	<div id="mobileMatlaOverlay" class="mobile-matla-overlay">
		<div class="mobile-matla-modal" role="dialog" aria-modal="true" aria-label="قائمة المطالع">
			<div class="mobile-matla-head">
				<h2>قائمة المطالع</h2>
				<button id="closeMobileMatla" class="close-search" type="button">✕</button>
			</div>
			<div id="matlaListMobile" class="matla-list mobile-matla-list"></div>
		</div>
	</div>



	<div id="imgLightbox" class="img-lightbox" onclick="closeImgLightbox()">
		<img id="imgLightboxImg" src="" alt="صورة مكبرة">
	</div>
</body>
</html>
