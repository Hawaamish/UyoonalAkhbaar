<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>خريطة - كتاب عيون الاَخبار</title>

<!-- ============================================================
     LIBRARIES
     OpenLayers v8 (map engine) + PapaParse (CSV parser), both CDN.
     ============================================================ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Font: Amiri for all UI and map labels -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="../styles/U2DigitalMap.css">
</head>
<body>

<div id="map"></div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div>الخريطة في التجهيز</div>
</div>

<!-- ZOOM CATEGORIES TOOLBAR -->
<div id="zoom-toolbar"></div>

<!-- SEARCH BAR -->
<div id="search-container">
  <div id="search-wrapper">
    <input 
      type="text" 
      id="search-input" 
      placeholder="ابحث عن موقع..."
      autocomplete="off"
    />
    <button id="search-btn" type="button" title="بحث">
      <svg class="search-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </button>
  </div>
  <div id="search-dropdown"></div>
</div>

<!-- Top toolbar + measure button hidden for now
<div id="top-toolbar">
  <div class="toolbar-cluster">
    <div class="toolbar-brand">
      <span class="eyebrow"></span>
      <span class="title"></span>
    </div>
    <div class="toolbar-actions">
      <button class="toolbar-btn" id="measure-toggle-btn" type="button" aria-pressed="false" title="تشغيل القياس">
        <span class="btn-text">القياس</span>
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="presentation">
            <path d="M4 16.5 16.5 4a2.12 2.12 0 0 1 3 0l.5.5a2.12 2.12 0 0 1 0 3L7.5 20a2.12 2.12 0 0 1-3 0l-.5-.5a2.12 2.12 0 0 1 0-3Z"></path>
            <path d="m9 7 8 8"></path>
            <path d="m11.5 4.5 2 2"></path>
            <path d="m6.5 9.5 2 2"></path>
            <path d="m4.5 14.5 2 2"></path>
          </svg>
        </span>
      </button>
    </div>
  </div>
</div>
-->

<button id="layers-toggle-btn" type="button" aria-controls="layer-panel" aria-expanded="true" title="Toggle layers panel">
  <span class="toggle-text">إظهار الطبقات</span>
  <span class="hamburger" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </span>
</button>

<!-- LAYER CONTROL PANEL (populated dynamically once CSV is parsed) -->
<div id="layer-panel">
  <h3>Map Layers</h3>
  <div id="layer-tree"><!-- checkboxes injected by JS --></div>
</div>

<!-- BOTTOM DIALOGUE BOX / CARD POPUP -->
<div id="feature-popup">
  <div class="popup-shell">
    <button class="popup-close" id="popup-close-btn" title="Close">✕</button>

    <div class="popup-header">
      <p class="popup-name" id="popup-name">—</p>
    </div>

    <div class="popup-info-card">
      <p class="mini-label" id="popup-info-label">Information</p>
      <div id="popup-info">—</div>
    </div>

    <div class="popup-fehrist-card">
      <p class="mini-label">الفهرست</p>
      <div id="popup-fehrist">—</div>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-csv.js"></script>
<script src="../assets/js/graticules.js"></script>
<script src="../assets/js/measure.js"></script>
<script src="../assets/js/esri-shaded-relief.js"></script>
<script src="../assets/js/maseer-alias-line.js"></script>
<script src="../assets/js/maseer-ayesha-route.js"></script>
<script src="../assets/js/app.js"></script>
</body>
</html>
