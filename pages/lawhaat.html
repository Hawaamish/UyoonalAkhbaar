<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اللوحات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg-deep:#607d51;
    --bg-page:#fcfcf8;
    --bg-panel:#f7f8f0;
    --bg-card:#fffefb;
    --pastel-mint:#fffefb;
    --pastel-sage:#607d51;
    --pastel-sage-dim:#849c7d;
    --pastel-moss:#d3dcba;
    --pastel-cream:#faf8f0;
    --line:#d3dcba;
    --line-soft:#e7ecd6;
    --ink:#3f3a33;
    --ink-dim:#746d62;
    --on-green:#ffffff;
    --warm-khaki:#c9bf97;
    --shadow:0 2px 12px rgba(96,125,81,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Amiri', serif;
    background:var(--bg-page);
    color:var(--ink);
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.top{
    background:var(--bg-deep);
    color:var(--pastel-mint);
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid var(--line-soft);
  }
  header.top > div{
    width:100%;
    text-align:center;
  }
  header.top h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:.5px;
    color:var(--pastel-mint);
  }
  /* ---------- Hero / search / toolbar zone ---------- */
  .hero{
    background:linear-gradient(180deg, rgba(96,125,81,.12) 0%, var(--bg-panel) 55%, var(--bg-page) 100%);
    padding:28px 20px 20px;
  }
  .search-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
  }
  .search-box{
    width:100%;
    max-width:520px;
    position:relative;
  }
  .search-box input{
    width:100%;
    height:44px;
    border-radius:999px;
    border:none;
    padding:0 46px 0 18px;
    font-family:'Amiri', serif;
    font-size:16px;
    background:var(--bg-card);
    color:var(--ink);
    box-shadow:var(--shadow);
    outline:none;
  }
  .search-box input::placeholder{color:var(--ink-dim);}
  .search-box input:focus{
    box-shadow:0 0 0 3px rgba(132,156,125,.24);
  }
  .search-box .icon{
    position:absolute;
    inset-inline-start:16px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    color:var(--ink-dim);
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    max-width:960px;
    margin:0 auto;
  }
  .pill{
    background:var(--bg-card);
    color:var(--ink);
    border:1px solid var(--line);
    padding:8px 18px;
    border-radius:999px;
    font-family:'Amiri', serif;
    font-size:14.5px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s;
    user-select:none;
  }
  .pill:hover{
    background:#f7f9f1;
    border-color:var(--pastel-sage-dim);
    color:var(--pastel-sage);
  }
  .pill.active{
    background:var(--pastel-sage);
    border-color:var(--pastel-sage);
    color:var(--on-green);
  }
  .pill.fav-pill{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .pill svg{width:15px;height:15px;vertical-align:-2px;}

  .toolbar-mobile{
    display:none;
    align-items:center;
    justify-content:space-between;
    max-width:960px;
    margin:0 auto;
  }
  .toolbar-mobile .current-cat{
    background:var(--pastel-sage);
    color:var(--on-green);
    padding:8px 16px;
    border-radius:999px;
    font-size:14px;
  }
  .dots-btn{
    background:var(--bg-card);
    border:none;
    border-radius:50%;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .dots-btn svg{width:20px;height:20px;color:var(--ink);}

  .cat-sheet{
    display:none;
    max-width:960px;
    margin:10px auto 0;
    background:var(--bg-card);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:10px;
    flex-direction:column;
    gap:6px;
  }
  .cat-sheet.open{display:flex;}
  .cat-sheet .pill{width:100%;text-align:center;}

  /* ---------- Grid ---------- */
  main{
    max-width:1100px;
    margin:0 auto;
    padding:26px 20px 60px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:22px;
    direction:rtl;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 8px 12px;
    cursor:pointer;
    position:relative;
    box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(96,125,81,.15);
    border-color:var(--pastel-sage-dim);
  }
  .card .thumb-wrap{
    aspect-ratio:1/1;
    border-radius:6px;
    overflow:hidden;
    background:var(--line-soft);
    position:relative;
  }
  .card .thumb-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .card .name{
    margin:10px 2px 0;
    font-size:15px;
    text-align:center;
    font-weight:700;
    color:var(--pastel-sage);
  }
  .fav-btn{
    position:absolute;
    inset-inline-start:14px;
    top:14px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--pastel-sage);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:2;
  }
  .fav-btn svg{width:16px;height:16px;stroke:#ffffff;fill:none;}
  .fav-btn.active svg{fill:#ffffff;stroke:#ffffff;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-dim);
    font-size:17px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(63,58,51,.58);
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--bg-card);
    width:min(96vw, 1300px);
    max-height:94vh;
    border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    display:grid;
    grid-template-columns:minmax(520px, 1.6fr) 360px;
    overflow:hidden;
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:12px;
    inset-inline-start:12px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--pastel-sage);
    color:var(--on-green);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
  }
  .modal-close svg{width:16px;height:16px;}

  .modal-image-side{
    min-width:520px;
    background:var(--bg-panel);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modal-image-side .img-scroll{
    width:100%;
    height:100%;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overscroll-behavior:contain;
  }
  .modal-image-side img{
    width:100%;
    max-width:none;
    height:auto;
    transform-origin:center center;
    transition:transform .15s ease;
    display:block;
  }
  .zoom-controls{
    position:absolute;
    top:12px;
    inset-inline-end:12px;
    display:flex;
    gap:6px;
    z-index:5;
  }
  .zoom-controls button{
    width:32px;
    height:32px;
    border-radius:8px;
    border:none;
    background:var(--pastel-sage);
    color:var(--on-green);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .zoom-controls button.active{
    background:var(--bg-deep);
  }
  .zoom-controls svg{width:16px;height:16px;}
  .modal-image-side:fullscreen{
    width:100vw;
    height:100vh;
    max-height:none;
    border-radius:0;
    background:#000;
    overflow:hidden;
  }
  .modal-image-side:fullscreen .img-scroll{
    width:100vw;
    height:100vh;
    overflow:hidden;
    touch-action:none;
  }
  .img-scroll.pan-active{cursor:grab;}
  .img-scroll.pan-active.dragging{cursor:grabbing;}
  .modal-image-side:fullscreen .img-scroll.pan-active{touch-action:none;}

  .modal-info-side{
    width:360px;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:16px;
    background:var(--bg-page);
    overflow-y:auto;
  }
  .info-title{
    font-size:18px;
    font-weight:700;
    color:var(--pastel-sage);
    margin:0 0 2px;
  }
  .ibarat-box{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    flex:1;
    font-size:16px;
    line-height:1.9;
    color:var(--ink);
    min-height:120px;
    overflow-y:auto;
  }
  .ibarat-box .label, .mini-card .label{
    display:block;
    font-size:12px;
    color:var(--pastel-sage);
    margin-bottom:6px;
    font-weight:700;
  }
  .mini-cards{
    display:flex;
    gap:10px;
  }
  .mini-card{
    flex:1;
    background:var(--pastel-sage);
    color:var(--on-green);
    border-radius:10px;
    padding:12px;
    text-align:center;
  }
  .mini-card .label{color:rgba(255,255,255,.75);}
  .mini-card .val{font-size:22px;font-weight:700;}

  /* ---------- Data source banner ---------- */
  .notice{
    max-width:1100px;
    margin:14px auto 0;
    padding:12px 18px;
    background:#f7f3e6;
    border:1px solid var(--warm-khaki);
    border-radius:10px;
    color:#6a6041;
    font-size:14px;
    display:none;
  }
  .notice.show{display:block;}

  /* ---------- Mobile ---------- */
  @media (max-width:720px){
    .grid{grid-template-columns:repeat(2, 1fr); gap:14px;}
    .toolbar{display:none;}
    .toolbar-mobile{display:flex;}
    header.top h1{font-size:21px;}
    .overlay{
      align-items:flex-start;
      padding:6px;
    }
    .modal{
      grid-template-columns:1fr;
      width:calc(100vw - 10px);
      height:auto;
      max-height:none;
      border-radius:12px;
      overflow:hidden;
    }
    .modal-image-side{
      min-width:0;
      min-height:42svh;
    }
    .modal-image-side .img-scroll{
      min-height:42svh;
    }
    .zoom-controls{display:none;}
    .modal-image-side:fullscreen .zoom-controls{display:flex;}
    .modal-image-side:fullscreen .img-scroll{touch-action:none;}
    .modal-info-side{
      width:auto;
      height:auto;
      max-height:none;
      overflow:visible;
    }
    .ibarat-box{
      min-height:auto;
      flex:none;
    }
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>اللوحات</h1>
  </div>
</header>

<div class="hero">
  <div class="search-wrap">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="ابحث عن لوحة...">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
  </div>

  <!-- Desktop toolbar -->
  <div class="toolbar" id="toolbarDesktop"></div>

  <!-- Mobile toolbar -->
  <div class="toolbar-mobile">
    <div class="current-cat" id="currentCatLabel">الكل</div>
    <button class="dots-btn" id="dotsBtn" aria-label="الفئات">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </div>
  <div class="cat-sheet" id="catSheet"></div>
</div>

<div class="notice" id="dataNotice">
  تعذر تحميل ملف Lawhaat/Lawhatdata.csv، لذلك تُعرض بيانات تجريبية. يمكنك فتحه مباشرة من الرابط أعلى الصفحة، أو ضع الملف الحقيقي داخل مجلد Lawhaat بجانب هذه الصفحة وشغّلها عبر خادم محلي (وليس بفتح الملف مباشرة) ليعمل التحميل التلقائي.
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">لا توجد نتائج مطابقة</div>
</main>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal-image-side">
      <div class="zoom-controls">
        <button id="handTool" aria-label="تحريك الصورة" title="تحريك الصورة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 11V7a1 1 0 0 1 2 0v4"/><path d="M10 11V6a1 1 0 0 1 2 0v5"/><path d="M12 11V5a1 1 0 0 1 2 0v6"/><path d="M14 11V7a1 1 0 0 1 2 0v8"/><path d="M8 11l-1.2-1.2a1.4 1.4 0 0 0-2 .1 1.4 1.4 0 0 0 .1 2L10 17h4l4.3-4.7a1.6 1.6 0 0 0-.1-2.2 1.5 1.5 0 0 0-2.1.1L15 12"/></svg>
        </button>
        <button id="fullscreenToggle" aria-label="ملء الشاشة" title="ملء الشاشة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M3 16v5h5"/><path d="M21 16v5h-5"/></svg>
        </button>
        <button id="zoomOut" aria-label="تصغير">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button id="zoomIn" aria-label="تكبير">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>
      <div class="img-scroll" id="imgScroll">
        <img id="modalImg" src="" alt="">
      </div>
    </div>
    <div class="modal-info-side">
      <div class="info-title" id="modalTitle"></div>
      <div class="ibarat-box">
        <span class="label">العبارة الشريفة</span>
        <div id="modalIbarat"></div>
      </div>
      <div class="mini-cards">
        <div class="mini-card">
          <span class="label">صفحة</span>
          <div class="val" id="modalPage"></div>
        </div>
        <div class="mini-card">
          <span class="label">سطر</span>
          <div class="val" id="modalLine"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ Sample fallback data (used only if the CSV can't be fetched) ============ */
const SAMPLE_DATA = [
  {srno:"1", lawhatname:"اللوحة الأولى", linktoimg:"https://drive.google.com/file/d/FILE_ID_1/view?usp=sharing", ibarat:"هذه عبارة تجريبية للوحة الأولى.", page:"12", line:"4", category:"فئة أ"},
  {srno:"2", lawhatname:"اللوحة الثانية", linktoimg:"https://drive.google.com/file/d/FILE_ID_2/view?usp=sharing", ibarat:"عبارة تجريبية ثانية.", page:"18", line:"9", category:"فئة ب"},
  {srno:"3", lawhatname:"اللوحة الثالثة", linktoimg:"https://drive.google.com/file/d/FILE_ID_3/view?usp=sharing", ibarat:"نص عبارة قصير.", page:"5", line:"2", category:"فئة أ"},
  {srno:"4", lawhatname:"اللوحة الرابعة", linktoimg:"https://drive.google.com/file/d/FILE_ID_4/view?usp=sharing", ibarat:"عبارة أخرى للتجربة.", page:"27", line:"15", category:"فئة ج"},
  {srno:"5", lawhatname:"اللوحة الخامسة", linktoimg:"https://drive.google.com/file/d/FILE_ID_5/view?usp=sharing", ibarat:"عبارة تجريبية خامسة.", page:"33", line:"1", category:"فئة ب"},
  {srno:"6", lawhatname:"اللوحة السادسة", linktoimg:"https://drive.google.com/file/d/FILE_ID_6/view?usp=sharing", ibarat:"عبارة تجريبية سادسة.", page:"41", line:"7", category:"فئة ج"},
  {srno:"7", lawhatname:"اللوحة السابعة", linktoimg:"https://drive.google.com/file/d/FILE_ID_7/view?usp=sharing", ibarat:"عبارة تجريبية سابعة.", page:"9", line:"3", category:"فئة أ"},
  {srno:"8", lawhatname:"اللوحة الثامنة", linktoimg:"https://drive.google.com/file/d/FILE_ID_8/view?usp=sharing", ibarat:"عبارة تجريبية ثامنة أطول قليلاً لاختبار التفاف النص.", page:"22", line:"11", category:"فئة ب"}
];

const CSV_PATH = "../Lawhaat/Lawhatdata.csv";
const FAV_KEY = "lawhaat_favorites";

let allData = [];
let activeCategory = "الكل";
let showFavoritesOnly = false;
let searchTerm = "";

/* ============ Google Drive link resolver ============ */
function resolveDriveLink(url){
  if(!url) return "";
  url = url.trim();
  let id = null;
  let m = url.match(/\/file\/d\/([^\/?#]+)/);
  if(m) id = m[1];
  if(!id){
    m = url.match(/[?&]id=([^&#]+)/);
    if(m) id = m[1];
  }
  if(!id){
    // already a bare file id
    if(/^[a-zA-Z0-9_-]{20,}$/.test(url)) id = url;
  }
  if(id){
    return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
  }
  return url; // fallback: use as-is (e.g. already a direct image URL)
}

/* ============ Favorites ============ */
function getFavorites(){
  try{ return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); }
  catch(e){ return []; }
}
function toggleFavorite(srno){
  let favs = getFavorites();
  const i = favs.indexOf(srno);
  if(i>-1) favs.splice(i,1); else favs.push(srno);
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
  return favs;
}

function normalizeRow(row){
  const normalized = {};
  Object.entries(row || {}).forEach(([key, value])=>{
    const cleanKey = String(key || "").trim().toLowerCase();
    normalized[cleanKey] = typeof value === "string" ? value.trim() : value;
  });
  return normalized;
}

function parseCsvText(csvText){
  const res = Papa.parse(csvText, {
    header:true,
    skipEmptyLines:true
  });
  if(!(res.data && res.data.length)) return false;
  const rows = res.data.map(normalizeRow).filter(r=>r.srno);
  if(!rows.length) return false;
  allData = rows;
  init();
  return true;
}

function scoreCsvText(csvText){
  const sample = csvText.slice(0, 8000);
  const arabicCount = (sample.match(/[\u0600-\u06FF]/g) || []).length;
  const replacementCount = (sample.match(/�/g) || []).length;
  return arabicCount - (replacementCount * 20);
}

function decodeCsvBuffer(buffer){
  const encodings = ["utf-8", "windows-1256"];
  let bestText = "";
  let bestScore = Number.NEGATIVE_INFINITY;
  for(const encoding of encodings){
    try{
      const csvText = new TextDecoder(encoding).decode(buffer);
      const score = scoreCsvText(csvText);
      if(score > bestScore){
        bestScore = score;
        bestText = csvText;
      }
    } catch(e){}
  }
  return bestText ? parseCsvText(bestText) : false;
}

/* ============ Load CSV ============ */
async function loadData(){
  try{
    const response = await fetch(CSV_PATH);
    if(!response.ok) throw new Error(`CSV load failed: ${response.status}`);
    const buffer = await response.arrayBuffer();
    if(!decodeCsvBuffer(buffer)) useFallback();
  } catch(e){
    useFallback();
  }
}
function useFallback(){
  allData = SAMPLE_DATA;
  document.getElementById("dataNotice").classList.add("show");
  init();
}

/* ============ Init UI ============ */
function init(){
  const cats = ["الكل", ...new Set(allData.map(r=>r.category).filter(Boolean))];
  buildToolbar(cats);
  render();
}

function buildToolbar(cats){
  const desktop = document.getElementById("toolbarDesktop");
  const sheet = document.getElementById("catSheet");
  desktop.innerHTML = "";
  sheet.innerHTML = "";

  cats.forEach(cat=>{
    const p1 = document.createElement("div");
    p1.className = "pill" + (cat===activeCategory ? " active" : "");
    p1.textContent = cat;
    p1.onclick = ()=>setCategory(cat);
    desktop.appendChild(p1);

    const p2 = p1.cloneNode(true);
    p2.onclick = ()=>{ setCategory(cat); document.getElementById("catSheet").classList.remove("open"); };
    sheet.appendChild(p2);
  });

  const favPill = document.createElement("div");
  favPill.className = "pill fav-pill" + (showFavoritesOnly ? " active" : "");
  favPill.innerHTML = `<svg viewBox="0 0 24 24" fill="${showFavoritesOnly ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9C.8 8.4 2.6 5 6 5c2 0 3.3 1 4.5 2.5C11.7 6 13 5 15 5c3.4 0 5.2 3.4 3.5 7-2.5 4.4-9.5 9-9.5 9z"/></svg> المفضلة`;
  favPill.onclick = ()=>{ showFavoritesOnly = !showFavoritesOnly; buildToolbar(cats); render(); };
  desktop.appendChild(favPill);
  sheet.appendChild(favPill.cloneNode(true)).onclick = ()=>{ showFavoritesOnly = !showFavoritesOnly; buildToolbar(cats); render(); document.getElementById("catSheet").classList.remove("open"); };

  document.getElementById("currentCatLabel").textContent = activeCategory + (showFavoritesOnly ? " · المفضلة" : "");
}

function setCategory(cat){
  activeCategory = cat;
  const cats = ["الكل", ...new Set(allData.map(r=>r.category).filter(Boolean))];
  buildToolbar(cats);
  render();
}

document.getElementById("dotsBtn").addEventListener("click", ()=>{
  document.getElementById("catSheet").classList.toggle("open");
});

document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value.trim();
  render();
});

/* ============ Render grid ============ */
function render(){
  const favs = getFavorites();
  let items = allData.filter(r=>{
    const matchesCat = activeCategory==="الكل" || r.category===activeCategory;
    const matchesSearch = !searchTerm || (r.lawhatname||"").includes(searchTerm);
    const matchesFav = !showFavoritesOnly || favs.includes(r.srno);
    return matchesCat && matchesSearch && matchesFav;
  }).sort((a, b)=>{
    const aNum = Number.parseInt(a.srno, 10);
    const bNum = Number.parseInt(b.srno, 10);
    if(Number.isNaN(aNum) && Number.isNaN(bNum)) return 0;
    if(Number.isNaN(aNum)) return 1;
    if(Number.isNaN(bNum)) return -1;
    return aNum - bNum;
  });

  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  grid.innerHTML = "";

  if(items.length===0){
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  items.forEach(r=>{
    const card = document.createElement("div");
    card.className = "card";

    const isFav = favs.includes(r.srno);
    const favBtn = document.createElement("button");
    favBtn.className = "fav-btn" + (isFav ? " active" : "");
    favBtn.setAttribute("aria-label","أضف للمفضلة");
    favBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.5-9C.8 8.4 2.6 5 6 5c2 0 3.3 1 4.5 2.5C11.7 6 13 5 15 5c3.4 0 5.2 3.4 3.5 7-2.5 4.4-9.5 9-9.5 9z"/></svg>`;
    favBtn.onclick = (ev)=>{
      ev.stopPropagation();
      toggleFavorite(r.srno);
      render();
    };

    const thumbWrap = document.createElement("div");
    thumbWrap.className = "thumb-wrap";
    const img = document.createElement("img");
    img.src = resolveDriveLink(r.linktoimg);
    img.alt = r.lawhatname || "";
    img.loading = "lazy";
    thumbWrap.appendChild(img);

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = r.lawhatname || "";

    card.appendChild(favBtn);
    card.appendChild(thumbWrap);
    card.appendChild(name);
    card.onclick = ()=>openModal(r);

    grid.appendChild(card);
  });
}

/* ============ Modal ============ */
let currentZoom = 100;
let wheelZoomHandler = null;
let panMode = false;
let panX = 0;
let panY = 0;
let panState = null;
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;
let touchTapHandler = null;
let pinchState = null;

function resetImageView(){
  currentZoom = 100;
  panX = 0;
  panY = 0;
  applyImageZoom();
}

function applyImageZoom(){
  const img = document.getElementById("modalImg");
  img.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom / 100})`;
}

function updatePanMode(){
  const scrollArea = document.getElementById("imgScroll");
  const handBtn = document.getElementById("handTool");
  scrollArea.classList.toggle("pan-active", panMode);
  handBtn?.classList.toggle("active", panMode);
}

function setZoom(nextZoom){
  currentZoom = Math.max(50, Math.min(nextZoom, 300));
  applyImageZoom();
}

function setPan(nextX, nextY){
  panX = nextX;
  panY = nextY;
  applyImageZoom();
}

function endPan(){
  const scrollArea = document.getElementById("imgScroll");
  if(panState){
    scrollArea.removeEventListener("pointermove", panState.move);
    scrollArea.removeEventListener("pointerup", panState.up);
    scrollArea.removeEventListener("pointercancel", panState.up);
    panState = null;
  }
  scrollArea.classList.remove("dragging");
}

function isMobileFullscreenImage(){
  const imageSide = document.querySelector(".modal-image-side");
  return window.matchMedia("(max-width:720px)").matches && document.fullscreenElement === imageSide;
}

function openModal(r){
  document.getElementById("modalTitle").textContent = r.lawhatname || "";
  document.getElementById("modalIbarat").textContent = r.ibarat || "";
  document.getElementById("modalPage").textContent = r.page || "-";
  document.getElementById("modalLine").textContent = r.line || "-";
  const img = document.getElementById("modalImg");
  img.src = resolveDriveLink(r.linktoimg);
  resetImageView();
  panMode = false;
  updatePanMode();
  img.onclick = ()=>{
    if(window.matchMedia("(max-width:720px)").matches && !document.fullscreenElement){
      document.querySelector(".modal-image-side")?.requestFullscreen?.();
    }
  };
  const scrollArea = document.getElementById("imgScroll");
  if(wheelZoomHandler){
    scrollArea.removeEventListener("wheel", wheelZoomHandler);
  }
  wheelZoomHandler = (event)=>{
    event.preventDefault();
    const delta = event.deltaY > 0 ? -10 : 10;
    setZoom(currentZoom + delta);
  };
  scrollArea.addEventListener("wheel", wheelZoomHandler, { passive:false });
  scrollArea.addEventListener("pointerenter", ()=>{
    panMode = true;
    updatePanMode();
  });
  scrollArea.addEventListener("pointerleave", ()=>{
    if(!panState){
      panMode = false;
      updatePanMode();
    }
  });
  if(touchTapHandler){
    scrollArea.removeEventListener("touchend", touchTapHandler);
  }
  touchTapHandler = (event)=>{
    if(!isMobileFullscreenImage()) return;
    const touch = event.changedTouches && event.changedTouches[0];
    if(!touch) return;
    const now = Date.now();
    const isDoubleTap = (now - lastTapTime) < 300 && Math.abs(touch.clientX - lastTapX) < 24 && Math.abs(touch.clientY - lastTapY) < 24;
    if(isDoubleTap){
      event.preventDefault();
      resetImageView();
      lastTapTime = 0;
      return;
    }
    lastTapTime = now;
    lastTapX = touch.clientX;
    lastTapY = touch.clientY;
  };
  scrollArea.addEventListener("touchend", touchTapHandler, { passive:false });
  scrollArea.addEventListener("click", handleImageClickReset);
  scrollArea.addEventListener("dblclick", handleImageClickReset);
  scrollArea.addEventListener("touchstart", (event)=>{
    if(!isMobileFullscreenImage()) return;
    if(event.touches.length !== 2) return;
    const [first, second] = event.touches;
    const startDistance = Math.hypot(second.clientX - first.clientX, second.clientY - first.clientY);
    pinchState = { startDistance, startZoom: currentZoom };
  }, { passive:false });
  scrollArea.addEventListener("touchmove", (event)=>{
    if(!isMobileFullscreenImage()) return;
    if(!pinchState || event.touches.length !== 2) return;
    event.preventDefault();
    const [first, second] = event.touches;
    const distance = Math.hypot(second.clientX - first.clientX, second.clientY - first.clientY);
    const scale = distance / pinchState.startDistance;
    setZoom(pinchState.startZoom * scale);
  }, { passive:false });
  scrollArea.addEventListener("touchend", (event)=>{
    if(event.touches && event.touches.length < 2){
      pinchState = null;
    }
  });
  scrollArea.onpointerdown = (event)=>{
    event.preventDefault();
    const isTouch = event.pointerType === "touch";
    if(isTouch && !isMobileFullscreenImage()) return;
    if(isTouch){
      const now = Date.now();
      const isDoubleTap = (now - lastTapTime) < 300 && Math.abs(event.clientX - lastTapX) < 24 && Math.abs(event.clientY - lastTapY) < 24;
      lastTapTime = now;
      lastTapX = event.clientX;
      lastTapY = event.clientY;
      if(isDoubleTap){
        resetImageView();
        return;
      }
    }
    if(!panMode) return;
    scrollArea.setPointerCapture(event.pointerId);
    const startX = event.clientX;
    const startY = event.clientY;
    const originX = panX;
    const originY = panY;
    scrollArea.classList.add("dragging");
    const move = (moveEvent)=>{
      const deltaX = moveEvent.clientX - startX;
      const deltaY = moveEvent.clientY - startY;
      setPan(originX + deltaX, originY + deltaY);
    };
    const up = ()=>{
      endPan();
    };
    panState = { move, up };
    scrollArea.addEventListener("pointermove", move);
    scrollArea.addEventListener("pointerup", up, { once:true });
    scrollArea.addEventListener("pointercancel", up, { once:true });
  };
  scrollArea.ondragstart = ()=>false;
  updatePanMode();
  document.getElementById("overlay").classList.add("open");
}
document.getElementById("modalClose").onclick = closeModal;
document.getElementById("overlay").addEventListener("click", (e)=>{
  if(e.target.id==="overlay") closeModal();
});
function closeModal(){
  if(document.fullscreenElement){
    document.exitFullscreen?.();
  }
  document.getElementById("overlay").classList.remove("open");
  const scrollArea = document.getElementById("imgScroll");
  if(wheelZoomHandler){
    scrollArea.removeEventListener("wheel", wheelZoomHandler);
    wheelZoomHandler = null;
  }
  scrollArea.onpointerdown = null;
  document.getElementById("modalImg").onclick = null;
  if(touchTapHandler){
    scrollArea.removeEventListener("touchend", touchTapHandler);
    touchTapHandler = null;
  }
  scrollArea.removeEventListener("click", handleImageClickReset);
  scrollArea.removeEventListener("dblclick", handleImageClickReset);
  pinchState = null;
  endPan();
  lastTapTime = 0;
  lastTapX = 0;
  lastTapY = 0;
}
document.getElementById("zoomIn").onclick = ()=>{
  setZoom(currentZoom + 10);
};
document.getElementById("zoomOut").onclick = ()=>{
  setZoom(currentZoom - 10);
};
document.getElementById("modalImg").ondblclick = ()=>{
  resetImageView();
};
document.getElementById("handTool").onclick = ()=>{
  panMode = !panMode;
  updatePanMode();
};
document.getElementById("fullscreenToggle").onclick = async ()=>{
  const imageSide = document.querySelector(".modal-image-side");
  if(!document.fullscreenElement){
    await imageSide.requestFullscreen?.();
    panMode = window.matchMedia("(max-width:720px)").matches;
    updatePanMode();
  } else {
    await document.exitFullscreen?.();
    panMode = false;
    updatePanMode();
  }
};
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape") closeModal();
});

function handleImageClickReset(event){
  if(event.detail === 2){
    event.preventDefault();
    resetImageView();
  }
}

document.addEventListener("fullscreenchange", ()=>{
  if(!isMobileFullscreenImage()){
    panMode = false;
    updatePanMode();
    pinchState = null;
  } else if(window.matchMedia("(max-width:720px)").matches){
    panMode = true;
    updatePanMode();
  }
});

loadData();
</script>
