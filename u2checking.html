<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Review Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23017374'/%3E%3Cpath d='M6 8c4-1 7 0 10 2 3-2 6-3 10-2v15c-4-1-7 0-10 2-3-2-6-3-10-2z' fill='%23fff5dc'/%3E%3Cpath d='M16 10v15' stroke='%23017374' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f9f7;--card:#fff;--ink:#183b39;--mute:#526b67;--line:#d3e4de;--acc:#017374;--acc2:#e2f2ed;--soft:#8dc8ba;--amber:#e5771e;--sun:#fdb617;--note:#fff5dc;--comment:#006966}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Amiri","Scheherazade New","Traditional Arabic",Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:10px;display:inline-flex;gap:6px;align-items:center;transition:transform .16s ease,border-color .16s ease,background-color .16s ease,box-shadow .16s ease,color .16s ease}
.btn:hover{border-color:var(--acc);box-shadow:0 3px 10px #01737418;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible,.notification-item:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.pri:hover{box-shadow:0 4px 12px #01737433}
.btn.rec{background:#a83c31;color:#fff;border-color:#a83c31}.btn.danger:hover{border-color:#a83c31;color:#a83c31}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:2px solid var(--soft);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:19px;margin:0;color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#live{font-size:13px;color:var(--mute)}
.presence-btn{white-space:nowrap}.presence-dot{color:var(--comment)}
.side-backdrop{position:fixed;inset:0;background:#1118;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s;z-index:10}
.side-backdrop.open{opacity:1;visibility:visible;transition:opacity .25s,visibility 0s}
.side-panel{position:fixed;top:0;right:0;bottom:0;width:min(330px,90vw);padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 35px #1113;z-index:11;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;overflow-y:auto}
.side-panel.open{transform:translateX(0);visibility:visible;transition:transform .25s ease,visibility 0s}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.side-head h2{margin:0;font-size:21px}.side-section{margin:18px 0 8px;color:var(--mute);font:700 11px/1.4 sans-serif;text-transform:uppercase;letter-spacing:.08em}
.side-panel .side-action{display:flex;width:100%;justify-content:flex-start;margin:7px 0;padding:10px 12px}
.side-panel [hidden]{display:none}
.presence-list .mrow{justify-content:space-between}.presence-list small{color:var(--mute)}
.notification-badge{background:var(--sun);color:var(--ink);border-radius:99px;min-width:22px;text-align:center;padding:0 6px;font:700 12px/22px sans-serif}
.notification-list{display:grid;gap:8px;margin-top:12px}
.notification-item{width:100%;text-align:left;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--card);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.notification-item:hover{transform:translateY(-1px);border-color:var(--acc);box-shadow:0 5px 16px #01737418}
.notification-item.unread{border-color:var(--acc);background:var(--acc2)}
.notification-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;font:14px/1.35 sans-serif}
.notification-heading b{color:var(--ink)}
.notification-new{flex:none;padding:2px 7px;border-radius:99px;background:var(--sun);color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.notification-time{display:block;margin-top:4px;color:var(--mute);font:11px/1.4 sans-serif}
.notification-context{font:12px/1.4 sans-serif;margin-top:5px}
.notification-page{display:inline-block;color:var(--acc);background:var(--acc2);border-radius:7px;padding:3px 8px;font-weight:700}
.notification-scope{display:inline-block;margin-inline-start:6px;border-radius:7px;padding:3px 8px;background:var(--note);color:var(--ink);font-weight:700}
.notification-item.page-discussion{border-inline-start:4px solid var(--amber)}
.notification-comment{display:block;margin-top:6px;padding:6px 9px;border-inline-start:3px solid var(--comment);border-radius:5px;background:var(--note);color:var(--ink);overflow-wrap:anywhere}
.notification-hint{color:var(--mute);font-size:14px}
.app{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px;max-width:1250px;margin:0 auto}
@media screen and (min-width:801px){
 #app{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
 #app header{flex:none}
 .app{flex:1;min-height:0;width:100%}
 .app aside{display:flex;flex-direction:column;min-height:0}
 .app .plist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 3px 4px 2px}
 .app .main{min-height:0;overflow-y:auto;overscroll-behavior:contain}
 .app .shot{top:0}
}
@media (max-width:800px){.app{grid-template-columns:1fr}}
.mobile-back{display:none}
@media (max-width:800px){
 header{position:static;padding:10px 12px}
 header .tools{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
 header .tools>*{flex:none}
 .app{padding:12px}
 body:not(.mobile-detail) .main,body.mobile-detail aside{display:none}
 .mobile-back{display:inline-flex;margin-bottom:12px}
 .modal.show{padding:0}
 .modal .box{width:100%;height:100%;max-height:none;border-radius:0;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
}
aside,.main{min-width:0}
.overall{background:linear-gradient(135deg,var(--card),var(--acc2));border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.page-nav-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.page-nav-head strong{font-size:19px}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--soft));transition:width .3s}
input[type=search],input[type=text],input[type=email],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pi{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;width:100%;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.pi:hover{transform:translateY(-1px);border-color:var(--acc)}
.pi.on{background:var(--acc2);border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.pi-select{display:flex;gap:10px;align-items:center;flex:1;min-width:0;text-align:left;border:0;padding:0;background:transparent}
.pi-select:focus-visible,.page-comment-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pi img{width:44px;height:56px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
.pi .nm{font-weight:700}.pi small{color:var(--mute)}.pi-select>span{flex:1;min-width:0}
.pi .bar{display:block}
.page-comment-btn{flex:none;display:inline-flex;align-items:center;gap:4px;padding:6px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--mute);font:700 12px/1 sans-serif}
.page-comment-btn svg{width:18px;height:18px}
.page-comment-btn.has{color:var(--ink);border-color:var(--amber);background:var(--note)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ph h2{margin:0;font-size:22px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.shot{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;position:sticky;top:70px}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 12px;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.it{border-bottom:1px dashed var(--line);padding:6px 0}
.ir{display:flex;gap:8px;align-items:flex-start}
.ir input[type=checkbox]{width:26px;height:26px;margin:6px 0 0;accent-color:var(--acc);flex:none;cursor:pointer}
.ir input[type=checkbox]:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.ir input[type=checkbox]:disabled{cursor:wait}
.ir textarea{border-color:transparent;background:transparent;resize:none;overflow:hidden;padding:3px 6px}
.ir textarea:focus{border-color:var(--line);background:var(--card)}
.it.done .ir textarea{text-decoration:line-through;color:var(--mute)}
.n{color:var(--mute);width:22px;margin-top:6px;font-size:13px;flex:none}
.ib{border:1px solid var(--line);background:transparent;border-radius:8px;padding:1px 8px;font-size:14px;white-space:nowrap;margin-top:4px}
.ib.has{border-color:var(--comment);color:var(--comment);background:var(--acc2)}
.ib svg{width:18px;height:18px;vertical-align:middle}
.by{font-size:13px;color:var(--mute);margin:-2px 0 0 52px}
.thread{background:var(--bg);padding:18px;overflow-y:auto;overscroll-behavior:contain}
.nt{align-self:flex-start;max-width:min(82%,490px);min-width:0;background:hsl(var(--chat-hue) 68% 96%);border:1px solid hsl(var(--chat-hue) 42% 87%);border-radius:6px 16px 16px 16px;padding:9px 12px;overflow-wrap:anywhere;box-shadow:0 2px 5px #01737412}
.nt.mine{align-self:flex-end;border-radius:16px 6px 16px 16px;background:hsl(var(--chat-hue) 58% 93%);border-color:hsl(var(--chat-hue) 42% 85%)}
.nt-head,.nt-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nt-head strong{color:hsl(var(--chat-hue) 66% 22%);font-size:14px}
.nt-foot{justify-content:flex-end;color:hsl(var(--chat-hue) 22% 30%);font:12px/1.5 sans-serif;margin-top:5px}
.nt-action{border:0;background:transparent;color:inherit;text-decoration:underline;padding:2px;cursor:pointer}
.nt-action:disabled{opacity:.5;cursor:not-allowed}
.nt-body{white-space:pre-wrap;overflow-wrap:anywhere}
.nt-reply{display:block;border-inline-start:3px solid var(--acc);padding:2px 7px;margin:4px 0;background:#ffffff80;border-radius:4px;color:hsl(var(--chat-hue) 22% 30%)}
.nt.notification-target{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.nt.notification-target .nt-body{font-size:14px}
.nt audio{width:100%;height:34px;margin-top:4px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.fl a{border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:14px;color:var(--acc);text-decoration:none;background:var(--card);max-width:100%;min-width:0;overflow-wrap:anywhere}
.fl img{max-width:100%;max-height:200px;border-radius:6px;display:block}
.comment-files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.comment-file{border:1px solid var(--line);border-radius:8px;padding:6px;max-width:180px;overflow-wrap:anywhere}
.comment-file img{display:block;max-width:100%;max-height:100px;border-radius:6px}
.comment-file button{margin-top:4px}
.comment-box audio{max-width:100%}
.mention{color:var(--acc);background:var(--acc2);border-radius:5px;padding:0 4px;font-weight:700}
.mention-picker{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
.mention-options{max-height:180px;overflow:auto;display:grid;gap:4px;margin-top:6px}
.mention-option{border:0;background:transparent;text-align:left;border-radius:7px;padding:5px 8px}
.mention-option:hover,.mention-option:focus-visible{background:var(--acc2)}
.mention-option small{display:block;color:var(--mute)}
.mic-level{display:flex;gap:8px;align-items:center;margin-top:8px}
.mic-level meter{flex:1}
.add{display:flex;gap:8px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.show{display:flex}
.box{background:var(--card);border-radius:16px;padding:18px;width:min(640px,100%);max-height:92vh;overflow:auto}
.box h3{margin:0 0 8px}
#commentM .comment-box{width:min(720px,100%);height:min(780px,calc(100vh - 28px));height:min(780px,calc(100dvh - 28px));max-height:none;padding:0;display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,var(--card),var(--acc2));flex:none}
.chat-head .mobile-back{margin:0}.chat-heading{flex:1;min-width:0}
.chat-heading h3{margin:0}.chat-heading p{margin:0;color:var(--mute);font-size:14px;line-height:1.35;max-height:2.7em;overflow:auto;overflow-wrap:anywhere;scrollbar-width:thin}
.chat-close{flex:none}
.chat-thread{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}
.chat-empty{margin:auto;text-align:center;color:var(--mute);background:var(--card);border-radius:12px;padding:10px 15px}
.chat-composer{flex:none;max-height:55%;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);padding:10px 14px;background:var(--card)}
.chat-composer label{margin:3px 0}
.chat-composer textarea{resize:vertical;min-height:54px;max-height:150px}
.chat-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.chat-tools .btn{font-size:14px;padding:5px 10px}
.chat-tools #commentSend{margin-inline-start:auto}
.chat-reply{border-inline-start:3px solid var(--acc);background:var(--acc2);border-radius:8px;padding:6px 9px;margin-bottom:8px}
.chat-reply:not([hidden]){display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-reply .btn{font-size:13px;padding:3px 8px}
.chat-composer .comment-files:not(:empty){max-height:120px;overflow-y:auto;margin-bottom:8px}
.voice-settings{font-size:14px;color:var(--mute);margin-top:7px}
.voice-settings summary{cursor:pointer;color:var(--acc)}
.voice-settings select{margin-top:4px}
.voice-settings small{display:block}
.chat-status{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.chat-tools .btn{border-radius:11px}
.chat-tools #commentSend{box-shadow:0 3px 10px #01737422}
.modal.show{animation:modal-fade-in .16s ease-out both}
.modal.show>.box{animation:modal-rise-in .18s ease-out both}
@keyframes modal-fade-in{from{opacity:0}to{opacity:1}}
@keyframes modal-rise-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:800px){#commentM .comment-box{width:100%;height:100%;border-radius:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
 .chat-head{padding:10px 12px}.chat-thread{padding:12px}.chat-composer{padding:8px 10px}.nt{max-width:90%}}
.gallery-box{width:min(980px,100%);display:flex;flex-direction:column;overflow:hidden}
.gallery-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.gallery-head h3{margin:0}.gallery-head p{margin:0;color:var(--mute);font-size:14px}
.gallery-search{margin:12px 0}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:max-content;align-content:start;gap:12px;overflow:auto;min-height:0;padding:3px;overscroll-behavior:contain}
.gallery-card{min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;transition:border-color .15s,transform .15s}
.gallery-card:hover{border-color:var(--acc);transform:translateY(-2px)}
.gallery-card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.gallery-card.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.gallery-preview{height:155px;background:var(--acc2);display:flex;align-items:center;justify-content:center;color:var(--mute)}
.gallery-preview img{width:100%;height:100%;object-fit:contain}
.gallery-info{display:block;padding:8px 10px}.gallery-info strong{display:block;overflow-wrap:anywhere}
.gallery-info small{color:var(--mute)}
.gallery-info .bar{display:block}
@media (max-width:800px){.modal .gallery-box{display:flex;overflow:hidden}.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute);cursor:pointer}
.drop.hot{border-color:var(--acc);background:var(--acc2)}.drop img{max-width:100%;max-height:200px;border-radius:8px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.mrow{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0}.mrow span{flex:1;min-width:0;overflow-wrap:anywhere}
#auth{max-width:380px;margin:12vh auto;padding:0 16px;text-align:center}
#auth .panel{text-align:left}#auth .btn{justify-content:center;width:100%;margin-top:8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;overflow:auto;z-index:30;padding:20px;text-align:center}
#lb img{max-width:100%;cursor:zoom-out}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40}
#toast.show{opacity:1}
#printArea{display:none}
@media print{
 body>*:not(#printArea){display:none!important}
 #printArea{display:block;color:#000;background:#fff}
 .pp{page-break-after:always;padding:6mm}
 .pp img{max-width:100%;max-height:140mm;display:block;margin:0 auto 6mm}
 .pp li{margin:4px 0;list-style:none}.pp .d{text-decoration:line-through;color:#555}.pp .q{margin-inline-start:20px;font-size:.9em;color:#333}
}
</style>
</head>
<body>
<div id="auth" style="display:none">
 <h1 style="margin-bottom:12px">📖 Page Review Tracker</h1>
 <div class="panel">
  <label>Email</label><input type="email" id="aE" autocomplete="username">
  <label>Password</label><input type="password" id="aP" autocomplete="current-password">
  <button class="btn pri" id="aIn">Sign in</button>
  <button class="btn" id="aUp">Create account</button>
  <p id="aMsg" style="color:var(--mute);font-size:14px;margin:10px 0 0"></p>
 </div>
</div>

<div id="app" style="display:none">
<header>
 <h1>📖 Page Review Tracker</h1>
 <div class="tools">
  <span id="live">Connecting…</span>
  <span id="refreshStatus" role="status" hidden></span>
  <button class="btn presence-btn" id="presenceBtn" aria-haspopup="dialog">Online members: connecting…</button>
  <button class="btn" id="notificationsBtn" aria-haspopup="dialog" aria-label="Notifications">🔔 Notifications <span class="notification-badge" id="notificationBadge" hidden>0</span></button>
  <button class="btn pri" id="addBtn">＋ Add page</button>
  <button class="btn" id="sideToggle" aria-label="Open menu" aria-controls="sidePanel" aria-expanded="false">☰ Menu</button>
 </div>
</header>
<div class="side-backdrop" id="sideBackdrop"></div>
<nav class="side-panel" id="sidePanel" aria-label="Tracker menu" aria-hidden="true" inert>
 <div class="side-head"><h2>Tracker menu</h2><button class="btn" id="sideClose" aria-label="Close menu">✕</button></div>
 <div class="side-section">Workspace</div>
 <button class="btn side-action" id="printAll">🖨 Print all</button>
 <div id="adminActions" hidden>
  <div class="side-section">Administration</div>

async function allRows(query){

 if(first.error&&first.status===416&&first.error.code==="PGRST103")first=await query(false).range(0,999);
 if(first.error)return{data:null,error:first.error};
 if(!first.data)return{data:null,error:new Error("No rows returned")};
 const rows=[...first.data];let offset=rows.length;
 if(typeof first.count==="number"){
  if(offset>=first.count)return{data:rows,error:null};
  if(!offset)return{data:null,error:new Error("Couldn’t read the requested rows")};
  const size=offset;let partial=false;
  while(offset<first.count){
   const starts=[];for(let i=0;i<4&&offset<first.count;i++,offset+=size)starts.push(offset);
   const results=await Promise.all(starts.map(start=>query(false).range(start,start+size-1)));
   for(let i=0;i<results.length;i++){
    const result=results[i];
    if(result.error&&result.status===416&&result.error.code==="PGRST103")return{data:rows,error:null};
    if(result.error)return{data:null,error:result.error};
    if(!result.data)return{data:null,error:new Error("No rows returned")};
    rows.push(...result.data);
    if(result.data.length<Math.min(size,first.count-starts[i])){
     if(!result.data.length)return{data:rows,error:null};
     offset=starts[i]+result.data.length;partial=true;break;
    }
   }
   if(partial)break;
  }
  if(!partial)return{data:rows,error:null};
 }
 while(true){
  if(!offset)return{data:rows,error:null};
  const{data,error,status}=await query(false).range(offset,offset+999);
  if(error&&status===416&&error.code==="PGRST103"&&offset>0)return{data:rows,error:null};
  if(error)return{data:null,error};
  if(!data)return{data:null,error:new Error("No rows returned")};
  if(!data.length)return{data:rows,error:null};
  rows.push(...data);offset+=data.length;

}

function renderMentionText(text){
 let html="",offset=0;
 for(const match of text.matchAll(/@\[(\S+?)\]/g)){
  html+=esc(text.slice(offset,match.index));
  const member=members.find(m=>m.email.toLowerCase()===match[1].toLowerCase());
  html+=member?'<span class="mention">@'+esc(nm(member.email))+'</span>':esc(match[0]);
  offset=match.index+match[0].length;
 }
 return html+esc(text.slice(offset));
}

async function saveCheck(id,checked){
 const it=itemsById.get(id);if(!it||pendingChecks.has(id))return;
 const previous={done:it.done,done_by:it.done_by,done_at:it.done_at};
 const update={done:checked,done_by:checked?me:null,done_at:checked?new Date().toISOString():null};
 pendingChecks.set(id,{update});updateItem(it,update);refreshChecks();
 try{
  const{data,error}=await sb.from("items").update(update).eq("id",id).select("id,done,done_by,done_at").maybeSingle();
  if(error)throw error;if(!data)throw new Error("Point was not updated");
  ++itemsVersion;
  const current=itemsById.get(id);if(current)updateItem(current,data);
  const needsRefresh=pendingChecks.get(id)?.needsRefresh;
  pendingChecks.delete(id);refreshChecks();
  if(needsRefresh){await loadItems();draw()}
 }catch(er){
  pendingChecks.delete(id);const current=itemsById.get(id);if(current)updateItem(current,previous);
  refreshChecks();await loadItems();draw();fail(er);
 }
}

 return match?{start:start-match[1].length-1,end:start,query:match[1]}:null;
}

function makeWav(chunks,count,rate){
 const buffer=new ArrayBuffer(44+count*2),view=new DataView(buffer);
 const write=(offset,text)=>{for(let i=0;i<text.length;i++)view.setUint8(offset+i,text.charCodeAt(i))};
 write(0,"RIFF");view.setUint32(4,36+count*2,true);write(8,"WAVE");write(12,"fmt ");
 view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
 view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
 write(36,"data");view.setUint32(40,count*2,true);
 let offset=44;for(const chunk of chunks)for(const sample of chunk){view.setInt16(offset,sample,true);offset+=2}
 return new Blob([buffer],{type:"audio/wav"});
}
function audioBufferToWav(audio){
 const rate=Math.min(16000,audio.sampleRate),length=Math.min(audio.length,audio.sampleRate*120),channels=[];
 for(let c=0;c<audio.numberOfChannels;c++)channels.push(audio.getChannelData(c));
 if(!channels.length||!audio.length)throw new Error("Recording contains no audio samples");
 let channel=channels[0],strongest=-1;
 for(const candidate of channels){let power=0;for(let i=0;i<length;i++)power+=candidate[i]*candidate[i];if(power>strongest){strongest=power;channel=candidate}}
 const samples=new Int16Array(Math.ceil(length*rate/audio.sampleRate));
 let count=0,phase=0,sum=0,n=0,peak=0;
 for(let i=0;i<length;i++){
  const value=channel[i];
  peak=Math.max(peak,Math.abs(value));sum+=value;n++;phase+=rate;
  if(phase>=audio.sampleRate){const v=Math.max(-1,Math.min(1,sum/n));samples[count++]=v<0?v*32768:v*32767;phase-=audio.sampleRate;sum=0;n=0}
 }
 if(!count)throw new Error("Recording contains no audio samples");
 return{blob:makeWav([samples.subarray(0,count)],count,rate),peak};
}
function showVoiceError(audio,message){
 let warning=audio.nextElementSibling;
 if(!warning||!warning.classList.contains("voice-error")){warning=document.createElement("small");warning.className="voice-error";warning.setAttribute("role","alert");audio.after(warning)}
 warning.textContent=message;
}
document.addEventListener("error",e=>{
 if(e.target.tagName==="AUDIO"&&$("commentM").contains(e.target))showVoiceError(e.target,"Couldn’t play this recording. Check the microphone or try another browser.");
},true);

function recordingType(){
 if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return"";
 const audio=document.createElement("audio");
 return ["audio/mp4;codecs=mp4a.40.2","audio/webm;codecs=opus","audio/ogg;codecs=opus"]
  .find(type=>MediaRecorder.isTypeSupported(type)&&audio.canPlayType(type))||"";
}

/* voice notes: native recording when playable, otherwise mono PCM WAV */
async function toggleRec(iid){
 if(rec){if(rec.state==="recording"){rec.stop();renderCommentDraft()}return}
 recStarting=true;$("micFeedback").textContent="Starting microphone…";renderCommentDraft();let st,ctx,source,processor,gain,frame,recorder;
 try{
  const device=$("commentMic").value;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("Microphone access requires HTTPS or localhost");
  const type=recordingType(),AudioContext=window.AudioContext||window.webkitAudioContext;
  let resume,monitorError="";
  if(AudioContext){
   try{ctx=new AudioContext();resume=ctx.resume().then(()=>null,er=>er)}catch(er){monitorError=er.message}
  }
  st=await navigator.mediaDevices.getUserMedia({audio:device?{deviceId:{exact:device}}:true});
  const tracks=st.getAudioTracks();if(!tracks.length||tracks.every(t=>t.readyState==="ended"))throw new Error("No active microphone was found");
  if(ctx&&ctx.state!=="running"){
   let timer;const result=await Promise.race([resume,new Promise(resolve=>{timer=setTimeout(()=>resolve(new Error("Audio input did not start")),4000)})]);
   clearTimeout(timer);if(result||ctx.state!=="running")monitorError=(result&&result.message)||"Audio input did not start";
  }
  if(!type&&(!ctx||ctx.state!=="running"||!ctx.createScriptProcessor))throw new Error(monitorError||"This browser does not support audio recording");
  let peak=0,monitored=false,reason="",recordingError=null,count=0,phase=0,sum=0,n=0;
  const chunks=[],rate=ctx?Math.min(16000,ctx.sampleRate):0,limit=rate*120,started=Date.now();
  const finish=(blob,error)=>{
   clearTimeout(recT);if(frame)cancelAnimationFrame(frame);
   if(source)source.disconnect();if(processor){processor.onaudioprocess=null;processor.disconnect()}if(gain)gain.disconnect();
   st.getTracks().forEach(t=>t.stop());if(ctx)ctx.close().catch(er=>console.error("Couldn’t close audio recorder:",er));
   $("micLevel").value=0;rec=null;recFor=null;
   if(error||!blob||!blob.size){const message=error?error.message||String(error):"No audio was recorded. Check your microphone and try again.";
    $("micFeedback").textContent=message;toast(message)}
   else{
    const warning=[reason,monitored&&peak<0.003?"Little or no sound detected.":!monitored?"Input level unavailable.":""].filter(Boolean).join(" ");
    pd(iid).voices.push({blob,url:URL.createObjectURL(blob),warning});
    $("micFeedback").textContent=warning||"";
   }
   renderCommentDraft();if(dirty&&!busy())draw();
  };
  const recording={state:"recording",stop:message=>{
   if(recording.state!=="recording")return;recording.state="inactive";clearTimeout(recT);
   reason=message||"";renderCommentDraft();
   if(recorder){if(recorder.state!=="inactive")recorder.stop()}
   else finish(count?makeWav(chunks,count,rate):null,null);
  }};
  const levelFeedback=level=>{
   monitored=true;peak=Math.max(peak,level);$("micLevel").value=Math.min(1,level*5);
   $("micFeedback").textContent=tracks.every(t=>t.muted)?"Microphone is muted. Check your device settings.":
    Date.now()-started>3000&&peak<0.003?"No sound detected. Select the correct microphone and check its permissions.":"";
  };
  if(ctx&&ctx.state==="running")source=ctx.createMediaStreamSource(st);
  if(type){
   recorder=new MediaRecorder(st,{mimeType:type});let recordedType=recorder.mimeType||type;
   recorder.ondataavailable=e=>{if(e.data.size){chunks.push(e.data);if(e.data.type)recordedType=e.data.type}};
   recorder.onerror=e=>{recordingError=e.error||new Error("Recording failed")};
   recorder.onstop=async()=>{
    const blob=new Blob(chunks,{type:recordedType});
    if(recordingError||!blob.size){finish(blob,recordingError);return}
    let converted;
    try{
     if(!ctx||!ctx.decodeAudioData)throw new Error("Audio decoding unavailable");
     const audio=await ctx.decodeAudioData(await blob.arrayBuffer());converted=audioBufferToWav(audio);
    }catch(er){
     const warning="WAV conversion failed: "+er.message+". This recording may not play in every browser.";
     reason=reason?reason+" "+warning:warning;finish(blob,null);return;
    }
    peak=Math.max(peak,converted.peak);monitored=true;finish(converted.blob,null);
   };
   if(source){
    const analyser=ctx.createAnalyser(),samples=new Uint8Array(analyser.fftSize);gain=ctx.createGain();gain.gain.value=0;
    source.connect(analyser);analyser.connect(gain);gain.connect(ctx.destination);
    const tick=()=>{if(ctx.state==="running"){analyser.getByteTimeDomainData(samples);let power=0;
     for(const sample of samples)power+=((sample-128)/128)**2;levelFeedback(Math.sqrt(power/samples.length))}
     frame=requestAnimationFrame(tick)};
    tick();
   }else $("micFeedback").textContent="Input level unavailable.";
   recorder.start(1000);
  }else{
   processor=ctx.createScriptProcessor(4096,1,1);
   processor.onaudioprocess=e=>{
    e.outputBuffer.getChannelData(0).fill(0);
    const input=e.inputBuffer.getChannelData(0),out=new Int16Array(Math.ceil(input.length*rate/ctx.sampleRate)+1);
    let size=0,power=0;for(const sample of input){
     power+=sample*sample;sum+=sample;n++;phase+=rate;
     if(phase>=ctx.sampleRate){const v=Math.max(-1,Math.min(1,sum/n));out[size++]=v<0?v*32768:v*32767;phase-=ctx.sampleRate;sum=0;n=0;
      if(count+size>=limit)break}
    }
    levelFeedback(Math.sqrt(power/input.length));if(size){chunks.push(out.subarray(0,size));count+=size}
    if(count>=limit)recording.stop();
   };
   source.connect(processor);processor.connect(ctx.destination);
  }
  rec=recording;recFor=iid;listMicrophones();
  tracks.forEach(track=>track.addEventListener("ended",()=>recording.stop("Microphone disconnected.")));
  recT=setTimeout(()=>recording.stop(),120000);
 }catch(er){
  if(frame)cancelAnimationFrame(frame);if(processor)processor.disconnect();if(source)source.disconnect();if(gain)gain.disconnect();if(st)st.getTracks().forEach(t=>t.stop());
  if(ctx)ctx.close().catch(err=>console.error("Couldn’t close audio recorder:",err));
  rec=null;recFor=null;$("micFeedback").textContent="Couldn’t start recording: "+(er.message||"check microphone permission and use HTTPS or localhost");toast($("micFeedback").textContent);
 }
 finally{recStarting=false;renderCommentDraft()}
}

 $("mmE").value="";$("mmN").value="";await loadAll();drawMem();toast("Added "+email)};

/* ---------- Backblaze migration ---------- */
$("migrateMedia").onclick=async()=>{
 if(!isAdmin){toast("Only admins can migrate media");return}
 if(mediaMigrationRunning||!confirm("Copy every file in Supabase Storage to Backblaze and switch active tracker references? Supabase originals will be kept."))return;
 mediaMigrationRunning=true;$("migrateMedia").disabled=true;$("backblazeStatus").hidden=false;
 try{
  const result=await window.migrateTrackerMediaToBackblaze({
   sb,bucket:B,allRows,isAdmin,
   onProgress:progress=>{
    $("backblazeStatus").textContent=progress.stage==="copy"
     ?"Copying "+(progress.completed+1)+" of "+progress.total+" files to Backblaze…"
     :progress.stage==="references"?"Updating media references "+(progress.completed+1)+" of "+progress.total+"…"
     :"Backblaze migration complete.";
   }
  });
  $("backblazeStatus").textContent="Copied "+result.files+" files; updated "+result.updated+" references. Supabase originals retained.";
  toast("Media now loads from Backblaze. Supabase originals were kept.");
 }catch(er){
  console.error("Backblaze migration failed:",er);
  $("backblazeStatus").textContent="Migration stopped: "+er.message+". You can retry safely.";
  toast("Backblaze migration stopped: "+er.message);
 }finally{mediaMigrationRunning=false;$("migrateMedia").disabled=false}
};

/* ---------- administrator refresh ---------- */
function restoreRefreshView(userId){
 try{
  const key="tracker-refresh-view:"+userId,raw=sessionStorage.getItem(key);if(!raw)return null;
  sessionStorage.removeItem(key);const view=JSON.parse(raw);
  if((view.page!==null&&typeof view.page!=="string")||!["all","open","done"].includes(view.filter)||
     typeof view.search!=="string"||typeof view.mobileDetail!=="boolean"||
     ![view.mainScroll,view.listScroll,view.windowScroll].every(Number.isFinite))throw new Error("Invalid saved workspace");
  return view;
 }catch(er){console.error("Couldn’t restore workspace after refresh:",er);return null}
}
function refreshIsBusy(){
 const active=document.activeElement;
 if(signedOut||!me||refreshSending||refreshActions||mediaMigrationRunning||rec||recStarting||commentSending||pageSaving||
    pendingWrites.size||pendingChecks.size||document.querySelector(".modal.show")||
    $("sidePanel").classList.contains("open")||$("lb").style.display==="block"||$("printArea").hasChildNodes()||
    (active&&active.matches("input:not([type=checkbox]),textarea,select,[contenteditable=true]"))||
    [...document.querySelectorAll("audio")].some(audio=>!audio.paused))return true;
 if($("newIt")?.value||$("mmE").value||$("mmN").value)return true;
 if(Object.values(pend).some(d=>d.text||d.replyTo||d.files.length||d.voices.length))return true;
 return [...document.querySelectorAll("textarea[data-t]")].some(field=>{
  const item=itemsById.get(field.dataset.t);return !item||field.value!==(item.text||"");
 });
}
function tryMemberRefresh(){
 refreshTimer=null;if(!refreshPending||signedOut)return;
 if(refreshIsBusy()||Date.now()-refreshActivity<2000){
  $("refreshStatus").textContent="Update waiting: finish or clear drafts and close open dialogs.";
  refreshTimer=setTimeout(tryMemberRefresh,1000);return;
 }
 try{
  sessionStorage.setItem("tracker-refresh-view:"+presenceUser,JSON.stringify({
   page:cur,filter,search:$("q").value,mobileDetail:document.body.classList.contains("mobile-detail"),
   mainScroll:$("main").scrollTop,listScroll:$("plist").scrollTop,windowScroll:window.scrollY
  }));
  const url=new URL(location.href);url.searchParams.set("tracker_refresh",String(refreshRevision));
  location.replace(url.href);
 }catch(er){
  refreshPending=false;console.error("Couldn’t preserve workspace for refresh:",er);
  $("refreshStatus").textContent="Couldn’t refresh safely. Save your work and reload manually.";
 }
}
function observeRefreshRevision(revision,fromEvent=false){
 if(!Number.isSafeInteger(revision)||revision<0)throw new Error("Invalid tracker refresh revision");
 if(refreshRevision!==null&&revision<=refreshRevision)return;
 const previous=refreshRevision;refreshRevision=revision;
 if(previous!==null||fromEvent){
  refreshPending=true;$("refreshStatus").hidden=false;
  $("refreshStatus").textContent="An admin requested an update.";
  if(!refreshTimer)refreshTimer=setTimeout(tryMemberRefresh,0);
 }
}
async function checkRefreshRevision(fromEvent=false){
 const{data,error}=await sb.from("tracker_refresh").select("revision").eq("id",true).single();
 if(error)throw error;
 if(!data)throw new Error("Tracker refresh configuration is missing");
 observeRefreshRevision(data.revision,fromEvent);
}
function reportRefreshError(er){
 console.error("Couldn’t check tracker refresh:",er);
 if(isAdmin)toast("Refresh unavailable: "+er.message+". Run tracker-refresh.sql in Supabase.");
}
$("refreshMembers").onclick=async()=>{
 if(!isAdmin){toast("Only admins can request a refresh");return}
 if(refreshSending||!confirm("Refresh all connected members when their work is safe?"))return;
 refreshSending=true;$("refreshMembers").disabled=true;
 try{
  const{data,error}=await sb.rpc("request_tracker_refresh");if(error)throw error;
  observeRefreshRevision(data,true);setSideOpen(false);
  toast("Refresh requested. Members will reload when their work is safe.");
 }catch(er){toast("Couldn’t request refresh: "+er.message)}
 finally{refreshSending=false;$("refreshMembers").disabled=false}
};
for(const event of ["pointerdown","keydown","input","scroll"])window.addEventListener(event,()=>{refreshActivity=Date.now()},true);
for(const [id,event] of [["main","onclick"],["main","onchange"],["main","onkeydown"],["commentThread","onclick"],["commentSend","onclick"],["migrateMedia","onclick"],
 ["mOk","onclick"],["impF","onchange"],["exp","onclick"],["memL","onclick"],["memAdd","onclick"],["notificationList","onclick"]]){
 const element=$(id),handler=element[event];
 element[event]=async function(e){refreshActions++;try{return await handler.call(this,e)}finally{refreshActions--}};
}
</script>
